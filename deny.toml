# cargo deny check: where the Rust dependencies come from, their licenses, known
# vulnerabilities and banned crates.
[graph]
all-features = true

[advisories]
# A crate its authors gave up on, anywhere in the tree, or a yanked version fails.
unmaintained = "all"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
