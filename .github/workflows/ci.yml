name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job says otherwise; only publish writes, and it runs none of the
# project's code.
permissions:
  contents: read

# Cargo builds offline from vendor/ (see SUPPLY_CHAIN.md). Each job downloads it per
# Cargo.lock and fuzz/Cargo.lock, or restores it from the cache keyed by both; release always
# downloads it, so that what it builds never comes from a cache another job wrote.

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: rclone version
        id: rclone
        run: |
          version=$(grep -o 'RCLONE_VERSION: &str = "v[^"]*"' build.rs | grep -o 'v[0-9.]*')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RSE_LIBRCLONE_DIR=$HOME/librclone" >> "$GITHUB_ENV"
      # librclone takes minutes to compile; cache it per OS, rclone version, build script and
      # the Go module it is built from.
      - name: Cache librclone
        id: librclone
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/librclone
          key: librclone-${{ runner.os }}-${{ steps.rclone.outputs.version }}-${{ hashFiles('scripts/build-librclone.sh', 'librse/**') }}
      - name: Build librclone
        if: steps.librclone.outputs.cache-hit != 'true'
        run: scripts/build-librclone.sh ~/librclone
      # rse's own rc calls, which the archive adds to rclone's.
      - name: Go checks and tests of librse
        working-directory: librse
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      # The build directory, per OS, toolchain and Cargo.lock; release builds without it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: target-${{ runner.os }}-
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked
      - run: cargo clippy --locked -p xtask
      - run: cargo test --locked -p xtask
      - run: cargo clippy --all-targets --locked --no-default-features --features rcd
      - run: cargo build --locked
      - run: cargo test --locked

  # The rcd feature needs no Go, so this build runs with no network at all.
  build-offline:
    name: build without network (rcd feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: vendor-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      # As the runner's user, not root: a test checks that an unwritable directory is not
      # written to.
      - name: Build and test without network
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" -e CARGO_HOME=/tmp/cargo \
            -e RUSTUP_TOOLCHAIN=1.99.1 -v "$PWD":/src -w /src rust:1.99.1 \
            sh -c 'cargo build --locked --offline --no-default-features --features rcd &&
                   cargo test --locked --offline --no-default-features --features rcd'
      # Keeps the dependencies this build used, in case a crate is ever taken off crates.io.
      - run: tar czf vendor-${{ hashFiles('Cargo.lock') }}.tar.gz vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vendor-${{ hashFiles('Cargo.lock') }}
          path: vendor-*.tar.gz
          retention-days: 90

  # Builds the release archives, read-only.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-offline]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - name: Tools for license texts and the embedded dependency list
        run: |
          (cd "$HOME" && cargo install --locked cargo-about cargo-auditable)
          go install github.com/google/go-licenses@latest
      # cargo auditable embeds the dependency list, so cargo audit bin can check a release.
      - name: Build
        run: cargo auditable build --release --locked
      - name: Package
        run: |
          dir="rse-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp target/release/rse README.md LICENSE "$dir/"
          PATH="$(go env GOPATH)/bin:$PATH" scripts/third-party-licenses.sh "$dir/third-party"
          ./target/release/rse --version > "$dir/VERSIONS"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: rse-*.tar.gz
          if-no-files-found: error

  # Publishes the release from the archives built above, and starts the security audit for
  # it. A release published with this job's token starts no workflow by itself, so the
  # audit's release trigger in verify.yml would never fire; a workflow_dispatch does, and
  # runs the tasks verify.yml runs at a release by default.
  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "" dist/rse-*.tar.gz
          gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
