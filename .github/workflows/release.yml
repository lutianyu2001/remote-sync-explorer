name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

# Read-only unless a job says otherwise; only crates-io and publish can publish, and they run
# none of the project's code.
permissions:
  contents: read

# The release jobs download vendor/ per Cargo.lock and fuzz/Cargo.lock every time and restore
# no cache, so that nothing they build or publish comes from a cache another run wrote.

jobs:
  # The tests and the offline build of ci.yml: a release goes out only when they pass.
  # ./ rather than $/, which actionlint 1.7.12 does not know yet.
  ci: # zizmor: ignore[self-repository]
    uses: ./.github/workflows/ci.yml

  # Builds the release archives, read-only.
  release:
    needs: ci
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      # Pinned: cargo-about 0.9.3 installs its program only with the cli feature, and an
      # unpinned install took that release without it, failing the build of v0.1.0.
      - name: Tools for license texts and the embedded dependency list
        run: |
          cd "$HOME"
          cargo install --locked --features cli cargo-about@0.9.3
          cargo install --locked cargo-auditable@0.7.7
          go install github.com/google/go-licenses@v1.6.0
      # Before the build, which embeds licenses.txt for rse --licenses to print.
      - name: License texts
        run: PATH="$(go env GOPATH)/bin:$PATH" scripts/third-party-licenses.sh "$RUNNER_TEMP/third-party"
      # cargo auditable embeds the dependency list, so cargo audit bin can check a release.
      - name: Build
        run: |
          export THIRD_PARTY_LICENSES="$RUNNER_TEMP/third-party/licenses.txt"
          cargo auditable build --release --locked
      - name: Check that rse prints its license texts
        run: scripts/check-embedded-licenses.sh target/release/rse "$RUNNER_TEMP/third-party/licenses.txt"
      # The package as crates.io will build it. cargo refuses to publish a crates-io that
      # .cargo/config.toml replaces with vendor/ without --registry crates-io, and needs the network
      # that net.offline turns off.
      - name: Check the crate
        if: matrix.name == 'linux-x86_64'
        run: cargo --config net.offline=false publish --dry-run --locked --registry crates-io
      - name: Package
        run: |
          dir="rse-${GITHUB_REF_NAME}-${{ matrix.name }}"
          mkdir -p "$dir"
          cp target/release/rse README.md LICENSE "$dir/"
          cp -R "$RUNNER_TEMP/third-party" "$dir/third-party"
          ./target/release/rse --version > "$dir/VERSIONS"
          tar czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: rse-*.tar.gz
          if-no-files-found: error

  # Publishes the crate by trusted publishing (the environment crates-io). The release job's dry
  # run built this package from the same tag and Cargo.lock, so this one only packages and
  # uploads, and runs no build script with the token at hand. Packaging reads vendor/ even
  # without verifying; downloading it runs no code.
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo --config net.offline=false publish --locked --no-verify --registry crates-io

  # Publishes the release from the archives built above, and starts the security audit for
  # it. A release published with this job's token starts no workflow by itself, so the
  # audit's release trigger in verify.yml would never fire; a workflow_dispatch does, and
  # runs the tasks verify.yml runs at a release by default.
  publish:
    needs: [release, crates-io]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "" dist/rse-*.tar.gz
          gh workflow run verify.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
