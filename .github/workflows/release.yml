# The release of prebuilt archives: pushing a version tag runs ci.yml, then builds the archives on
# each system, and creates the GitHub release with them. This file holds all of the project's
# releasing; what is marked Per project is this project's own. By hand: the same build commands,
# then gh release create with the archives.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Per project: the crate published to crates.io.
  CRATE: rse
  # Per project: true where .cargo/config.toml replaces crates.io with vendor/. cargo publish then
  # needs --registry crates-io, and the network that net.offline turns off (cargo 1.99.1).
  VENDOR: true

jobs:
  # The project's ci.yml, its checks and tests: a release goes out only when they pass. Per project:
  # without a ci.yml (a fork whose tests run in build), delete this job and build's needs.
  # ./ rather than $/, which actionlint 1.7.12 does not know yet.
  ci: # zizmor: ignore[self-repository]
    uses: ./.github/workflows/ci.yml

  # Builds the archives from the tag, with neither a secret nor a token that can write: building runs
  # the project's code and its dependencies'.
  build:
    needs: ci
    strategy:
      matrix:
        # Per project: the systems the release ships for, each with the name its archive carries.
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-15
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Per project: the steps that build the program from the tag and put it, with its license
      # texts, into dist/ as one archive per system, named <project>-<tag>-<name>.
      # vendor/ is downloaded per Cargo.lock and fuzz/Cargo.lock, never restored from a cache.
      - name: Download dependencies per Cargo.lock and fuzz/Cargo.lock
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      # Pinned: cargo-about 0.9.3 installs its program only with the cli feature, and an
      # unpinned install took that release without it, failing the build of v0.1.0.
      - name: Tools for license texts and the embedded dependency list
        run: |
          cd "$HOME"
          cargo install --locked --features cli cargo-about@0.9.3
          cargo install --locked cargo-auditable@0.7.7
          go install github.com/google/go-licenses@v1.6.0
      # Before the build, which embeds licenses.txt for rse --licenses to print.
      - name: License texts
        run: PATH="$(go env GOPATH)/bin:$PATH" scripts/third-party-licenses.sh "$RUNNER_TEMP/third-party"
      # cargo auditable embeds the dependency list, so cargo audit bin can check a release.
      - name: Build
        run: |
          export THIRD_PARTY_LICENSES="$RUNNER_TEMP/third-party/licenses.txt"
          cargo auditable build --release --locked
      - name: Check that rse prints its license texts
        run: scripts/check-embedded-licenses.sh target/release/rse "$RUNNER_TEMP/third-party/licenses.txt"
      # The package as crates.io will build it, before dist/ is written into the checkout. cargo
      # refuses to publish a crates-io that .cargo/config.toml replaces with vendor/ without
      # --registry crates-io, and needs the network that net.offline turns off.
      - name: Check the crate
        if: matrix.name == 'linux-x86_64'
        run: cargo --config net.offline=false publish --dry-run --locked --registry crates-io -p "$CRATE"
      - name: Build and pack
        env:
          NAME: ${{ matrix.name }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="rse-$TAG-$NAME"
          mkdir -p "$dir" dist
          cp target/release/rse README.md LICENSE "$dir/"
          cp -R man "$dir/man"
          cp -R "$RUNNER_TEMP/third-party" "$dir/third-party"
          ./target/release/rse --version > "$dir/VERSIONS"
          tar czf "dist/$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  crates-io:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Per project: as in the build job. Packaging reads vendor/ even without verifying (cargo
      # 1.99.1, on rse); downloading runs no code.
      - name: Download the dependencies into vendor/
        if: env.VENDOR == 'true'
        run: >
          cargo --config net.offline=false vendor --locked --versioned-dirs
          --sync fuzz/Cargo.toml vendor

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # The build job's dry run built this package from the same tag and Cargo.lock, so this one
      # only packages and uploads, and runs no build script with the token at hand.
      - name: Publish the crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ "$VENDOR" = true ]; then
            cargo --config net.offline=false publish --locked --no-verify --registry crates-io -p "$CRATE"
          else
            cargo publish --locked --no-verify -p "$CRATE"
          fi

  # Creates the release from the archives build made, and runs none of the project's code.
  github-release:
    needs: [build, crates-io]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      # Per project: only to start verify.yml below.
      actions: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          # Per project: with the security audit's verify.yml, which a release made with this
          # token would not start on its own.
          gh workflow run verify.yml -R "$GITHUB_REPOSITORY" --ref "$TAG"
