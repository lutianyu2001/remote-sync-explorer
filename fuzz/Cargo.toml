# Fuzz targets for rse's parsers (see SECURITY.md): cargo +nightly fuzz run <target>
[package]
name = "rse-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# A workspace of its own, with its own Cargo.lock: libfuzzer and the fuzz targets never
# enter rse's dependencies.
[workspace]

[dependencies]
libfuzzer-sys = { version = "0.4.13", features = ["arbitrary-derive"] }
remote-sync-explorer = { path = "..", default-features = false }
toml = "1.1.8"
unicode-segmentation = "1.13.3"

[[bin]]
name = "address"
path = "fuzz_targets/address.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ssh_command"
path = "fuzz_targets/ssh_command.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secrets"
path = "fuzz_targets/secrets.rs"
test = false
doc = false
bench = false
