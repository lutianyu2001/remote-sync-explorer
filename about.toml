# cargo about generate about.hbs: the license texts of the Rust dependencies, collected by
# scripts/third-party-licenses.sh. Copied to the repository's root as about.toml.
#
# Per project: the licenses accepted, only those the dependency tree uses and that the
# project's own license can take in (compatibility.md, table A), as SPDX identifiers.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
