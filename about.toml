# cargo about generate about.hbs: the license texts of the Rust dependencies, collected by
# scripts/third-party-licenses.sh. Copied to the repository's root as about.toml.
#
# Per project: the licenses accepted, only those the dependency tree uses and that the
# project's own license can take in (compatibility.md, table A), as SPDX identifiers.
accepted = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# Only what is compiled into the artifact: a build script's dependencies only run while it
# is built, and the tests' are not built into it. Per project: false where a build-dependency
# compiles C sources into the artifact (openssl-src and the other *-src crates; how to find
# them: distribution.md).
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Per project: a license accepted for one crate only, after the user decided so for that
# crate: one that compat.py --accepted leaves out (MPL, LGPL: distribution.md, the cases that
# stop) or that table A marks ⚠, for example:
# [<crate>]
# accepted = ["MPL-2.0"]
